[package]
name = "aihub-auto-desktop"
version = "0.4.5"
description = "Native desktop shell for the aihub-auto router"
authors = ["WSXYT"]
license = "MIT"
repository = "https://github.com/WSXYT/aihub-auto"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aihub_auto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
