name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun -e 'const tag=process.env.RELEASE_TAG; const app=await Bun.file("apps/desktop/package.json").json(); const tauri=await Bun.file("apps/desktop/src-tauri/tauri.conf.json").json(); const cargo=(await Bun.file("apps/desktop/src-tauri/Cargo.toml").text()).match(/^version = "([^"]+)"/m)?.[1]; const versions=[app.version,tauri.version,cargo]; if(!cargo||new Set(versions).size!==1||tag!==`v${app.version}`) throw new Error(`release tag/version mismatch: ${tag} vs ${versions.join(",")}`); console.log(`validated ${tag}`)'
      - run: bun test
      - run: bunx tsc --noEmit -p tsconfig.json

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts
      - uses: actions/upload-artifact@v4
        with:
          name: aihub-auto-headless
          path: artifacts/aihub-auto-headless-*.zip
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*.zip
          draft: true
          body_path: docs/release-downloads.md
          generate_release_notes: true

  desktop:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: ""
            args: --bundles deb
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Upload portable Windows desktop ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $root = "apps/desktop/src-tauri/target/release"
          $portable = "$root/portable"
          $archive = "$root/aihub-auto-desktop-windows-x64.zip"
          $desktop = "$root/aihub-auto-desktop.exe"
          $sidecar = "apps/desktop/src-tauri/binaries/aihub-auto-router-x86_64-pc-windows-msvc.exe"
          if (!(Test-Path $desktop) -or !(Test-Path $sidecar)) { throw "portable desktop files are missing" }
          Remove-Item -Recurse -Force $portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portable | Out-Null
          Copy-Item $desktop "$portable/aihub-auto-desktop.exe"
          Copy-Item $sidecar "$portable/aihub-auto-router.exe"
          Compress-Archive -Path "$portable/*" -DestinationPath $archive -Force
          gh release upload "$env:GITHUB_REF_NAME" $archive --clobber

  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          notes="$(mktemp)"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed -e "s|__VERSION__|${GITHUB_REF_NAME#v}|g" -e "s|__DOWNLOAD_BASE__|https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME|g" > "$notes"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F make_latest=true
